<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>麻雀スコアシート (安定動作版)</title>
  <style>
    :root {
      --bg: #090e0c;
      --card-bg: #131c18;
      --card-border: #1f3029;
      --accent: #10b981;
      --accent-gold: #f59e0b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --danger: #ef4444;
      --danger-bg: #351414;
      --success: #10b981;
      --success-bg: #0c3327;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 480px;
      margin: 0 auto;
      padding: 8px 10px calc(8px + var(--safe-bottom)) 10px;
      justify-content: space-between;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 0;
      flex-shrink: 0;
    }

    .app-brand {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-header-sync {
      background: #0d2b20;
      border: 1px solid var(--accent);
      color: #34d399;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-header-manage {
      background: #14201c;
      border: 1px solid var(--card-border);
      color: #d1d5db;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-pills {
      display: flex;
      background: #111a17;
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
    }
    .tab-pill {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 4px;
      cursor: pointer;
    }
    .tab-pill.active {
      background: var(--accent);
      color: #fff;
    }

    .round-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 6px 10px;
      margin: 3px 0;
      flex-shrink: 0;
    }

    .round-nav-btn {
      background: #1a2923;
      border: 1px solid #283e35;
      color: var(--text);
      border-radius: 4px;
      padding: 4px 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }
    .round-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .round-title {
      font-size: 0.92rem;
      font-weight: 800;
      color: var(--accent-gold);
    }

    .players-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex: 1;
      margin: 4px 0;
      align-content: stretch;
    }
    .grid-3p {
      grid-template-columns: 1fr;
      grid-template-rows: repeat(3, 1fr);
    }

    .player-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .player-card:focus-within {
      border-color: var(--accent);
      background: #16241f;
    }

    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 4px;
    }

    .player-select-btn {
      background: #0d1613;
      border: 1px solid #273d34;
      color: var(--accent-gold);
      font-size: 0.9rem;
      font-weight: 800;
      border-radius: 6px;
      padding: 3px 6px;
      cursor: pointer;
      max-width: 65%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-total-badge {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .score-input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 4px 0;
    }

    .score-input-field {
      width: 100%;
      background: #0b1310;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      color: #fff;
      font-size: 1.45rem;
      font-weight: 800;
      text-align: center;
      padding: 6px 2px;
      -moz-appearance: textfield;
    }
    .score-input-field::-webkit-outer-spin-button,
    .score-input-field::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .score-input-field:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.25);
    }

    .val-plus { color: #34d399 !important; }
    .val-minus { color: #f87171 !important; }
    .val-zero { color: var(--text-muted) !important; }

    .status-banner {
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
      font-weight: 700;
      margin: 3px 0;
      flex-shrink: 0;
    }
    .status-banner-ok {
      background: var(--success-bg);
      border: 1px solid var(--success);
      color: #a7f3d0;
    }
    .status-banner-error {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fecaca;
    }
    .status-banner-wait {
      background: #131c19;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .bottom-bar {
      display: flex;
      gap: 6px;
      margin-top: 4px;
      flex-shrink: 0;
    }

    .action-btn {
      flex: 1;
      padding: 11px 0;
      font-size: 0.9rem;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .btn-next-round {
      background: var(--accent);
      color: #fff;
    }
    .btn-next-round:disabled {
      background: #1c2b25;
      color: #52635c;
      cursor: not-allowed;
    }
    .btn-sub {
      flex: 0.6;
      background: #141f1b;
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(4px);
      z-index: 99;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-content {
      background: #131f1a;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-body {
      padding: 14px;
      overflow-y: auto;
      flex: 1;
    }

    .sync-card {
      background: #0d1613;
      border: 1px solid #23382f;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .form-inline {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .form-input {
      flex: 1;
      background: #09120f;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: #fff;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .player-tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0 14px 0;
    }
    .player-tag {
      background: #182620;
      border: 1px solid #293f35;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .btn-tag-del {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 2px;
    }
    .btn-tag-del:hover {
      color: var(--danger);
    }

    .leaderboard-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #0d1613;
      border-radius: 8px;
      margin-bottom: 6px;
      border: 1px solid #1c2c25;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <header>
      <div class="app-brand">🀄 麻雀スコア</div>
      <div class="header-actions">
        <button class="btn-header-sync" id="btn-room-sync" onclick="openRoomModal()">
          <span id="room-sync-icon">🔗</span> <span id="room-sync-text">部屋未接続</span>
        </button>
        <button class="btn-header-manage" onclick="openPlayerModal()">👥 名簿</button>
        <div class="tab-pills">
          <button class="tab-pill active" id="tab-4p" onclick="switchMode('4p')">四麻</button>
          <button class="tab-pill" id="tab-3p" onclick="switchMode('3p')">三麻</button>
        </div>
      </div>
    </header>

    <div class="round-bar">
      <button class="round-nav-btn" id="btn-prev-round" onclick="navigateRound(-1)">◀ 前</button>
      <div class="round-title" id="round-indicator">第 1 半荘</div>
      <button class="round-nav-btn" id="btn-next-round-nav" onclick="navigateRound(1)">次 ▶</button>
    </div>

    <div class="players-grid" id="players-grid-container">
      <!-- 4枚または3枚のカード -->
    </div>

    <div class="status-banner status-banner-wait" id="status-banner">
      <span id="status-message">全員のスコアを入力してください</span>
      <span id="status-badge" style="font-size: 0.95rem;">計 0.0</span>
    </div>

    <div class="bottom-bar">
      <button class="action-btn btn-sub" onclick="openLeaderboard()">
        🏆 通算成績
      </button>
      <button class="action-btn btn-next-round" id="btn-complete-round" onclick="completeAndNextRound()">
        次へ進む (＋半荘) ❯
      </button>
    </div>

  </div>

  <!-- 部屋共有（合言葉）モーダル -->
  <div class="modal-overlay" id="room-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div style="font-weight: 800; color: var(--accent-gold);">🔗 ルーム共有（合言葉でリアルタイム同期）</div>
        <button onclick="closeRoomModal()" style="background:none; border:none; color:#9ca3af; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">

        <div class="sync-card">
          <div style="font-weight:700; color:#fff; font-size:0.85rem; margin-bottom:6px;">部屋の合言葉（ルームID）</div>
          <div style="display:flex; gap:6px;">
            <input type="text" id="room-id-input" class="form-input" placeholder="例: 1234 や taku1">
            <button class="action-btn btn-next-round" style="flex:0.4;" onclick="connectRoom()">接続</button>
          </div>
          <div style="font-size:0.75rem; color:#9ca3af; margin-top:8px; line-height:1.4;">
            💡 **設定不要！** 同じ合言葉（例: 1234）を入力した全員のスマホ・PC間でスコアが自動同期されます。スプレッドシートやGASの設定は一切不要です。
          </div>
        </div>

        <div class="sync-card" id="room-status-card" style="display:none; margin-top:10px;">
          <div style="font-weight:700; color:var(--accent-gold); font-size:0.85rem; margin-bottom:6px;">現在の接続状態</div>
          <div style="font-size:0.85rem; color:#fff; font-weight:bold;" id="current-room-text">接続中: なし</div>
          <div style="display:flex; gap:6px; margin-top:10px;">
            <button class="action-btn btn-sub" style="width:100%;" onclick="pullFromRoom(true)">🔄 手動で最新取得</button>
            <button class="action-btn btn-sub" style="width:100%; color:#f87171;" onclick="disconnectRoom()">❌ 切断する</button>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- プレイヤー管理モーダル -->
  <div class="modal-overlay" id="player-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div style="font-weight: 800; color: var(--accent-gold);">👥 プレイヤー名簿</div>
        <button onclick="closePlayerModal()" style="background:none; border:none; color:#9ca3af; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div style="font-size:0.8rem; color:#9ca3af;">新規プレイヤー追加:</div>
        <div class="form-inline">
          <input type="text" id="new-player-input" class="form-input" placeholder="例: 佐藤、プロA">
          <button class="action-btn btn-next-round" style="flex:0.4; padding:8px 12px;" onclick="addPlayerFromModal()">追加</button>
        </div>

        <div style="font-size:0.8rem; color:#9ca3af; margin-top:10px;">登録プレイヤー一覧 (✕で削除):</div>
        <div class="player-tag-row" id="modal-player-tags"></div>

        <div style="margin-top:16px; border-top:1px solid var(--card-border); padding-top:12px;">
          <div style="font-size:0.8rem; color:var(--accent-gold); font-weight:700; margin-bottom:6px;">対局メンバー席替え:</div>
          <div id="modal-seat-selectors" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 通算成績モーダル -->
  <div class="modal-overlay" id="leaderboard-modal" onclick="closeModalOnBackdrop(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div style="font-weight: 800; color: var(--accent-gold);">🏆 プレイヤー別 通算スコア</div>
        <button onclick="closeLeaderboard()" style="background:none; border:none; color:#9ca3af; font-size:1.2rem; cursor:pointer;">✕</button>
      </div>
      <div class="modal-body">
        <div id="modal-leaderboard-list"></div>

        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px;">
          <button class="action-btn btn-sub" style="width: 100%;" onclick="exportText()">
            📋 成績をテキストコピー
          </button>
          <button class="action-btn btn-sub" style="width: 100%;" onclick="exportSql()">
            💾 DB Browser用SQL保存
          </button>
          <button class="action-btn btn-sub" style="width: 100%; color:#f87171;" onclick="resetAllRounds()">
            🗑️ 現在のモードを全クリア
          </button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_DATA = {
      mode: '4p',
      playersMaster: ['東家', '南家', '西家', '北家'],
      activeSeats: {
        '4p': ['東家', '南家', '西家', '北家'],
        '3p': ['東家', '南家', '西家']
      },
      currentRoundIdx: {
        '4p': 0,
        '3p': 0
      },
      sheets: {
        '4p': [
          [null, null, null, null]
        ],
        '3p': [
          [null, null, null]
        ]
      }
    };

    // ローカルストレージ最優先（入力阻害ゼロの超安定構成）
    let state = JSON.parse(localStorage.getItem('mahjong_app_state_v4')) || DEFAULT_DATA;
    let currentRoomId = localStorage.getItem('mahjong_room_id') || '';
    let isSyncing = false;
    let lastStateHash = "";
    let roomSyncTimer = null;

    document.addEventListener('DOMContentLoaded', () => {
      renderAll();
      if (currentRoomId) {
        updateRoomUI(true);
        pullFromRoom(true);
        startRoomPolling();
      } else {
        updateRoomUI(false);
      }
    });

    function saveState(shouldPush = true) {
      localStorage.setItem('mahjong_app_state_v4', JSON.stringify(state));
      renderUIWithoutInputs(); // 入力中のフォーカスを壊さずにUI更新
      if (shouldPush && currentRoomId) {
        pushToRoom();
      }
    }

    /* ユーザーが画面上で文字入力中かどうか判定 */
    function isUserTyping() {
      const activeEl = document.activeElement;
      return activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'SELECT' || activeEl.tagName === 'TEXTAREA');
    }

    /* ルームUIの更新 */
    function updateRoomUI(isConnected) {
      const icon = document.getElementById('room-sync-icon');
      const text = document.getElementById('room-sync-text');
      const input = document.getElementById('room-id-input');
      const statusCard = document.getElementById('room-status-card');
      const statusText = document.getElementById('current-room-text');

      if (isConnected && currentRoomId) {
        if (icon) icon.textContent = '🟢';
        if (text) text.textContent = `部屋: ${currentRoomId}`;
        if (input) input.value = currentRoomId;
        if (statusCard) statusCard.style.display = 'block';
        if (statusText) statusText.textContent = `接続中: 部屋 [ ${currentRoomId} ]`;
      } else {
        if (icon) icon.textContent = '🔗';
        if (text) text.textContent = '部屋未接続';
        if (input) input.value = '';
        if (statusCard) statusCard.style.display = 'none';
      }
    }

    function openRoomModal() {
      document.getElementById('room-modal').classList.add('open');
    }
    function closeRoomModal() {
      document.getElementById('room-modal').classList.remove('open');
    }

    function connectRoom() {
      const input = document.getElementById('room-id-input');
      const rawId = input ? input.value.trim() : '';
      if (!rawId) {
        alert('合言葉（ルームID）を入力してください。');
        return;
      }
      currentRoomId = rawId;
      localStorage.setItem('mahjong_room_id', currentRoomId);
      updateRoomUI(true);
      pullFromRoom(true);
      startRoomPolling();
      alert(`部屋「${currentRoomId}」に接続しました！\n同じ合言葉を入れた全員の端末でリアルタイム同期されます。`);
      closeRoomModal();
    }

    function disconnectRoom() {
      currentRoomId = '';
      localStorage.removeItem('mahjong_room_id');
      if (roomSyncTimer) clearInterval(roomSyncTimer);
      updateRoomUI(false);
      alert('部屋から切断しました。（スマホ本体の保存モードに戻りました）');
    }

    function startRoomPolling() {
      if (roomSyncTimer) clearInterval(roomSyncTimer);
      roomSyncTimer = setInterval(() => {
        if (currentRoomId && !isSyncing && !isUserTyping()) {
          pullFromRoom(false);
        }
      }, 4000);
    }

    const KV_ENDPOINT = 'https://kvdb.io/8D9aLz4eX9k2P1M3/mahjong_room_';

    function pushToRoom(isManual = false) {
      if (!currentRoomId || isSyncing) return;
      isSyncing = true;
      const jsonStr = JSON.stringify(state);

      fetch(KV_ENDPOINT + encodeURIComponent(currentRoomId), {
        method: 'POST',
        body: jsonStr
      })
      .then(res => {
        if (res.ok) {
          lastStateHash = jsonStr;
          if (isManual) alert('🟢 部屋へ最新スコアを同期・保存しました！');
        } else {
          if (isManual) alert('❌ 通信エラーが発生しました。');
        }
      })
      .catch(err => {
        console.error("Room Push Error:", err);
        if (isManual) alert('❌ 同期エラーが発生しました。');
      })
      .finally(() => { isSyncing = false; });
    }

    function pullFromRoom(isManual = false) {
      if (!currentRoomId || isSyncing) return;
      if (!isManual && isUserTyping()) return;
      isSyncing = true;

      fetch(KV_ENDPOINT + encodeURIComponent(currentRoomId) + '?t=' + Date.now())
      .then(res => {
        if (res.status === 404) {
          isSyncing = false;
          pushToRoom(false);
          return null;
        }
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(remoteData => {
        if (remoteData && remoteData.sheets) {
          const remoteJsonStr = JSON.stringify(remoteData);
          if (remoteJsonStr !== lastStateHash) {
            state = remoteData;
            lastStateHash = remoteJsonStr;
            localStorage.setItem('mahjong_app_state_v4', remoteJsonStr);
            renderAll();
          }
          if (isManual) alert('🟢 部屋から最新スコアを取得しました！');
        }
      })
      .catch(err => {
        console.error("Room Pull Error:", err);
        if (isManual) alert('❌ データ取得に失敗しました。');
      })
      .finally(() => { isSyncing = false; });
    }

    /* ===================================================
       🀄 UI・入力受入ロジック (フォーカス維持)
       =================================================== */

    function switchMode(newMode) {
      state.mode = newMode;
      document.getElementById('tab-4p').classList.toggle('active', newMode === '4p');
      document.getElementById('tab-3p').classList.toggle('active', newMode === '3p');
      saveState(true);
      renderAll();
    }

    function getCurrentRoundIdx() {
      return state.currentRoundIdx[state.mode] || 0;
    }

    function setCurrentRoundIdx(idx) {
      state.currentRoundIdx[state.mode] = idx;
      saveState(true);
      renderAll();
    }

    function navigateRound(delta) {
      const mode = state.mode;
      const current = getCurrentRoundIdx();
      const total = state.sheets[mode].length;
      const target = current + delta;
      if (target >= 0 && target < total) {
        setCurrentRoundIdx(target);
      }
    }

    // スコアの入力受け付け (マイナス入力途中 "-" をそのまま許容)
    function handleScoreInput(seatIdx, rawVal) {
      const mode = state.mode;
      const rIdx = getCurrentRoundIdx();
      const trimmed = rawVal.trim();

      // "-" や "-." の入力途中は入力を消去せずに文字としてそのまま維持
      if (trimmed === '-' || trimmed === '-.' || trimmed === '.') {
        const input = document.getElementById(`score-input-${seatIdx}`);
        if (input) input.className = 'score-input-field val-minus';
        return;
      }

      const parsed = trimmed === '' ? null : parseFloat(trimmed);

      state.sheets[mode][rIdx][seatIdx] = (parsed !== null && !isNaN(parsed)) ? parsed : null;

      const input = document.getElementById(`score-input-${seatIdx}`);
      if (input) {
        input.className = 'score-input-field ' + getColorClass(state.sheets[mode][rIdx][seatIdx]);
      }

      saveState(true);
      updateStatusBanner();
    }

    function getColorClass(val) {
      if (val === null || isNaN(val)) return 'val-zero';
      if (val > 0) return 'val-plus';
      if (val < 0) return 'val-minus';
      return 'val-zero';
    }

    function completeAndNextRound() {
      const mode = state.mode;
      const current = getCurrentRoundIdx();
      const seatsCount = state.activeSeats[mode].length;

      if (current === state.sheets[mode].length - 1) {
        state.sheets[mode].push(new Array(seatsCount).fill(null));
        setCurrentRoundIdx(current + 1);
      } else {
        setCurrentRoundIdx(current + 1);
      }
    }

    function renderAll() {
      renderRoundNav();
      renderPlayerCards();
      updateStatusBanner();
    }

    function renderUIWithoutInputs() {
      renderRoundNav();
      updateStatusBanner();
      // 入力欄の値を上書き再構築せずにバッジ類のみ更新
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const totalMap = {};
      seats.forEach(s => totalMap[s] = 0);
      state.sheets[mode].forEach(row => {
        if (row.every(v => v !== null && !isNaN(v))) {
          const sum = Math.round(row.reduce((a, b) => a + b, 0) * 10) / 10;
          if (Math.abs(sum) < 0.001) {
            row.forEach((pt, sIdx) => {
              const pName = seats[sIdx];
              totalMap[pName] = (totalMap[pName] || 0) + pt;
            });
          }
        }
      });
      seats.forEach((pName, sIdx) => {
        const badge = document.getElementById(`total-badge-${sIdx}`);
        if (badge) {
          const totalPt = (Math.round((totalMap[pName] || 0) * 10) / 10).toFixed(1);
          badge.innerText = `通算: ${totalPt > 0 ? '+' : ''}${totalPt}`;
        }
      });
    }

    function renderRoundNav() {
      const mode = state.mode;
      const current = getCurrentRoundIdx();
      const total = state.sheets[mode].length;

      document.getElementById('round-indicator').innerText = `第 ${current + 1} / ${total} 半荘`;
      document.getElementById('btn-prev-round').disabled = (current === 0);
      document.getElementById('btn-next-round-nav').disabled = (current === total - 1);
    }

    function renderPlayerCards() {
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const rIdx = getCurrentRoundIdx();
      const currentScores = state.sheets[mode][rIdx] || new Array(seats.length).fill(null);

      const totalMap = {};
      seats.forEach(s => totalMap[s] = 0);
      state.sheets[mode].forEach(row => {
        if (row.every(v => v !== null && !isNaN(v))) {
          const sum = Math.round(row.reduce((a, b) => a + b, 0) * 10) / 10;
          if (Math.abs(sum) < 0.001) {
            row.forEach((pt, sIdx) => {
              const pName = seats[sIdx];
              totalMap[pName] = (totalMap[pName] || 0) + pt;
            });
          }
        }
      });

      const container = document.getElementById('players-grid-container');
      container.className = `players-grid ${mode === '3p' ? 'grid-3p' : ''}`;
      container.innerHTML = '';

      seats.forEach((pName, sIdx) => {
        const val = currentScores[sIdx];
        const colorClass = getColorClass(val);
        const displayVal = (val !== null && !isNaN(val)) ? (val > 0 ? `+${val}` : val) : '';
        const totalPt = (Math.round((totalMap[pName] || 0) * 10) / 10).toFixed(1);
        const totalFormatted = totalPt > 0 ? `+${totalPt}` : totalPt;

        const card = document.createElement('div');
        card.className = 'player-card';
        card.innerHTML = `
          <div class="card-top-row">
            <button class="player-select-btn" onclick="openPlayerModal()" title="タップしてプレイヤー変更">
              ${pName} ▾
            </button>
            <span class="player-total-badge" id="total-badge-${sIdx}">通算: ${totalFormatted}</span>
          </div>
          <div class="score-input-wrap">
            <input type="text" inputmode="decimal"
              class="score-input-field ${colorClass}"
              id="score-input-${sIdx}"
              value="${displayVal}"
              placeholder="0"
              oninput="handleScoreInput(${sIdx}, this.value)">
          </div>
          <div style="font-size: 0.68rem; color: var(--text-muted); text-align: center;">
            スコア(pt)を直接入力
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateStatusBanner() {
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const rIdx = getCurrentRoundIdx();
      const currentScores = state.sheets[mode][rIdx] || [];

      let sum = 0;
      let filledCount = 0;

      currentScores.forEach(v => {
        if (v !== null && !isNaN(v)) {
          sum += v;
          filledCount++;
        }
      });

      const banner = document.getElementById('status-banner');
      const msg = document.getElementById('status-message');
      const badge = document.getElementById('status-badge');
      const nextBtn = document.getElementById('btn-complete-round');

      const roundedSum = Math.round(sum * 10) / 10;

      if (filledCount === 0) {
        banner.className = 'status-banner status-banner-wait';
        msg.innerText = 'スコアを入力してください';
        badge.innerText = '計 0.0';
        nextBtn.disabled = true;
        return;
      }

      if (filledCount === seats.length) {
        if (Math.abs(roundedSum) < 0.001) {
          banner.className = 'status-banner status-banner-ok';
          msg.innerText = '✅ 合計 0.0 (整合性OK)';
          badge.innerText = '±0 pt';
          nextBtn.disabled = false;
        } else {
          const sign = roundedSum > 0 ? `+${roundedSum}` : `${roundedSum}`;
          banner.className = 'status-banner status-banner-error';
          msg.innerText = `❌ 合計が0ではありません (${sign})`;
          badge.innerText = `${sign} pt`;
          nextBtn.disabled = true;
        }
      } else {
        banner.className = 'status-banner status-banner-wait';
        msg.innerText = `入力中 (${filledCount}/${seats.length}名)`;
        badge.innerText = `計 ${roundedSum > 0 ? '+' : ''}${roundedSum}`;
        nextBtn.disabled = true;
      }
    }

    /* モーダル表示操作 */
    function openSheetModal() { document.getElementById('sheet-modal').classList.add('open'); }
    function closeSheetModal() { document.getElementById('sheet-modal').classList.remove('open'); }
    function openPlayerModal() { renderModalPlayerList(); renderModalSeatSelectors(); document.getElementById('player-modal').classList.add('open'); }
    function closePlayerModal() { document.getElementById('player-modal').classList.remove('open'); renderAll(); }

    function addPlayerFromModal() {
      const input = document.getElementById('new-player-input');
      const name = input.value.trim();
      if (!name) return;
      if (state.playersMaster.includes(name)) {
        alert('そのプレイヤー名は既に登録されています');
        return;
      }
      state.playersMaster.push(name);
      input.value = '';
      saveState(true);
      renderModalPlayerList();
      renderModalSeatSelectors();
    }

    function deletePlayerFromModal(targetName) {
      const minRequired = state.mode === '4p' ? 4 : 3;
      if (state.playersMaster.length <= minRequired) {
        alert(`${state.mode === '4p' ? '四人' : '三人'}麻雀では最低${minRequired}名のプレイヤーが必要です`);
        return;
      }
      if (confirm(`プレイヤー「${targetName}」を削除しますか？`)) {
        state.playersMaster = state.playersMaster.filter(p => p !== targetName);
        ['4p', '3p'].forEach(m => {
          state.activeSeats[m] = state.activeSeats[m].map((sName, sIdx) => {
            if (sName === targetName) {
              return state.playersMaster.find(p => !state.activeSeats[m].includes(p)) || state.playersMaster[sIdx] || `P${sIdx+1}`;
            }
            return sName;
          });
        });
        saveState(true);
        renderModalPlayerList();
        renderModalSeatSelectors();
      }
    }

    function renderModalPlayerList() {
      const container = document.getElementById('modal-player-tags');
      container.innerHTML = '';
      state.playersMaster.forEach(p => {
        const tag = document.createElement('span');
        tag.className = 'player-tag';
        tag.innerHTML = `
          <span>${p}</span>
          <button class="btn-tag-del" onclick="deletePlayerFromModal('${p.replace(/'/g, "\\'")}')">✕</button>
        `;
        container.appendChild(tag);
      });
    }

    function renderModalSeatSelectors() {
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const container = document.getElementById('modal-seat-selectors');
      container.innerHTML = '';

      seats.forEach((currentP, sIdx) => {
        const row = document.createElement('div');
        row.style.display = 'flex';
        row.style.alignItems = 'center';
        row.style.justifyContent = 'space-between';

        let options = '';
        state.playersMaster.forEach(p => {
          options += `<option value="${p}" ${p === currentP ? 'selected' : ''}>${p}</option>`;
        });

        row.innerHTML = `
          <span style="font-size:0.85rem; color:#9ca3af;">席 ${sIdx + 1}:</span>
          <select style="background:#09120f; border:1px solid var(--card-border); color:var(--accent-gold); padding:6px; border-radius:6px; font-weight:700; width:70%;"
            onchange="changeSeatPlayer(${sIdx}, this.value)">
            ${options}
          </select>
        `;
        container.appendChild(row);
      });
    }

    function changeSeatPlayer(seatIdx, newPlayerName) {
      state.activeSeats[state.mode][seatIdx] = newPlayerName;
      saveState(true);
    }

    function openLeaderboard() {
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const listEl = document.getElementById('modal-leaderboard-list');

      const stats = {};
      state.playersMaster.forEach(p => stats[p] = { total: 0, count: 0 });

      let validMatches = 0;
      state.sheets[mode].forEach(row => {
        if (row.every(v => v !== null && !isNaN(v))) {
          const sum = Math.round(row.reduce((a, b) => a + b, 0) * 10) / 10;
          if (Math.abs(sum) < 0.001) {
            validMatches++;
            row.forEach((pt, idx) => {
              const name = seats[idx];
              if (stats[name]) {
                stats[name].total += pt;
                stats[name].count++;
              }
            });
          }
        }
      });

      const sorted = Object.keys(stats).sort((a, b) => stats[b].total - stats[a].total);

      let html = `<div style="font-size:0.8rem; color:#9ca3af; margin-bottom:8px;">有効半荘: ${validMatches} 半荘</div>`;
      sorted.forEach((name, rank) => {
        const item = stats[name];
        const rounded = Math.round(item.total * 10) / 10;
        const color = rounded > 0 ? '#34d399' : (rounded < 0 ? '#f87171' : '#9ca3af');
        const formatted = rounded > 0 ? `+${rounded.toFixed(1)}` : rounded.toFixed(1);
        const avg = item.count > 0 ? (item.total / item.count).toFixed(1) : '0.0';

        html += `
          <div class="leaderboard-row">
            <div>
              <span style="color:var(--accent-gold); font-weight:800; margin-right:6px;">${rank + 1}位</span>
              <strong style="color:#fff;">${name}</strong>
              <div style="font-size:0.7rem; color:#9ca3af;">${item.count}回 (平均 ${avg}pt)</div>
            </div>
            <div style="font-size:1.15rem; font-weight:800; color:${color};">${formatted} <span style="font-size:0.75rem;">pt</span></div>
          </div>
        `;
      });

      listEl.innerHTML = html;
      document.getElementById('leaderboard-modal').classList.add('open');
    }

    function closeLeaderboard() {
      document.getElementById('leaderboard-modal').classList.remove('open');
    }

    function closeModalOnBackdrop(e) {
      if (e.target.id === 'sheet-modal') closeSheetModal();
      if (e.target.id === 'player-modal') closePlayerModal();
      if (e.target.id === 'leaderboard-modal') closeLeaderboard();
    }

    function exportText() {
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const rows = state.sheets[mode];

      let text = `【麻雀スコア (${mode === '4p' ? '四麻' : '三麻'})】\n`;
      let valid = 0;
      rows.forEach((row, idx) => {
        if (row.every(v => v !== null && !isNaN(v)) && Math.abs(row.reduce((a,b)=>a+b,0)) < 0.001) {
          valid++;
          const rowStr = row.map((p, sIdx) => `${seats[sIdx]}:${p > 0 ? '+' : ''}${p}`).join('  ');
          text += `#${idx + 1}: ${rowStr}\n`;
        }
      });

      navigator.clipboard.writeText(text).then(() => {
        alert('クリップボードにコピーしました！');
      }).catch(() => {
        prompt('コピーしてください:', text);
      });
    }

    function exportSql() {
      const mode = state.mode;
      const seats = state.activeSeats[mode];
      const rows = state.sheets[mode];
      const now = new Date().toISOString().replace('T', ' ').substring(0, 19);

      let sql = `BEGIN TRANSACTION;\n`;
      sql += `INSERT INTO sessions (session_name, rule_type, created_at) VALUES ('スマホ記録 (${mode})', '${mode}', '${now}');\n`;
      sql += `DROP TABLE IF EXISTS _temp_s;\n`;
      sql += `CREATE TEMP TABLE _temp_s AS SELECT last_insert_rowid() AS s_id;\n`;

      seats.forEach(p => {
        sql += `INSERT OR IGNORE INTO players (name, created_at) VALUES ('${p.replace(/'/g, "''")}', '${now}');\n`;
      });

      let mNum = 1;
      rows.forEach(row => {
        if (row.every(v => v !== null && !isNaN(v))) {
          const sum = Math.round(row.reduce((a, b) => a + b, 0) * 10) / 10;
          sql += `INSERT INTO matches (session_id, round_number, total_score_sum, is_valid_zero, recorded_at) SELECT s_id, ${mNum}, ${sum}, ${Math.abs(sum)<0.001?1:0}, '${now}' FROM _temp_s;\n`;
          sql += `DROP TABLE IF EXISTS _temp_m; CREATE TEMP TABLE _temp_m AS SELECT last_insert_rowid() AS m_id;\n`;
          row.forEach((pt, idx) => {
            sql += `INSERT INTO match_scores (match_id, player_id, score_point) SELECT m.m_id, p.player_id, ${pt} FROM _temp_m m, players p WHERE p.name = '${seats[idx].replace(/'/g, "''")}';\n`;
          });
          mNum++;
        }
      });
      sql += `COMMIT;\n`;

      const blob = new Blob([sql], { type: 'text/sql;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mahjong_score_${mode}.sql`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function resetAllRounds() {
      if (confirm('現在のモードの全半荘記録を初期化しますか？')) {
        const mode = state.mode;
        state.sheets[mode] = [new Array(state.activeSeats[mode].length).fill(null)];
        state.currentRoundIdx[mode] = 0;
        saveState(true);
        closeLeaderboard();
        renderAll();
      }
    }
  </script>
</body>
</html>
