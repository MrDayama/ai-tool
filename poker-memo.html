<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎴 Poker Memo Web</title>
  <meta name="description" content="ライブポーカー ハンド入力・アクションテーブル・ハンドリプレイ Webツール">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="project/poker-memo/style.css">
</head>
<body>

<!-- ===== ヘッダー ===== -->
<header class="header">
  <h1>🎴 Poker Memo Web</h1>
  <span id="street-badge" class="badge">PREFLOP</span>

  <select id="seat-count" title="テーブル人数">
    <option value="2">2名 (HU)</option>
    <option value="3">3名</option>
    <option value="4">4名</option>
    <option value="5">5名</option>
    <option value="6" selected>6名 (6-Max)</option>
    <option value="7">7名</option>
    <option value="8">8名</option>
    <option value="9">9名 (Full Ring)</option>
  </select>

  <button id="unit-toggle">表示: BB</button>

  <!-- 共有・保存ボタン群 -->
  <button onclick="copyHandText()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.82rem;cursor:pointer;">📋 ハンドコピー</button>
  <button onclick="renderSavedHandsModal()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.82rem;cursor:pointer;">💾 保存履歴</button>
  <button onclick="exportHandsJSON()" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.82rem;cursor:pointer;">📥 エクスポート</button>
</header>

<!-- ===== PC: 3カラム メインレイアウト ===== -->
<div class="main-layout">

  <!-- 左パネル -->
  <aside class="left-panel">
    <div class="card">
      <h3>ブラインド設定</h3>
      <div class="rate-presets">
        <button class="rate-preset" data-sb="0.5" data-bb="1">0.5/1</button>
        <button class="rate-preset" data-sb="1"   data-bb="2">1/2</button>
        <button class="rate-preset" data-sb="2"   data-bb="5">2/5</button>
        <button class="rate-preset" data-sb="5"   data-bb="10">5/10</button>
        <button class="rate-preset" data-sb="10"  data-bb="20">10/20</button>
        <button class="rate-preset" data-sb="25"  data-bb="50">25/50</button>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
        <label style="font-size:.78rem;color:var(--text-sub)">SB
          <input type="number" id="input-sb" value="1" min="0.01" step="0.5" style="width:100%;margin-top:3px">
        </label>
        <label style="font-size:.78rem;color:var(--text-sub)">BB
          <input type="number" id="input-bb" value="2" min="0.01" step="0.5" style="width:100%;margin-top:3px">
        </label>
      </div>
      <label style="font-size:.78rem;color:var(--text-sub);display:block;margin-top:10px">アンティ
        <select id="ante-type" style="width:100%;margin-top:3px">
          <option value="none">なし</option>
          <option value="regular">通常 Ante（全員）</option>
          <option value="bb" selected>BB Ante（BBが全員分）</option>
        </select>
      </label>
      <label style="font-size:.78rem;color:var(--text-sub);display:flex;align-items:center;gap:8px;margin-top:10px">
        <input type="checkbox" id="straddle-toggle"> UTG Straddle
      </label>
    </div>

    <div class="card">
      <h3>プレイヤー & スタック</h3>
      <div class="seat-config-list" id="seat-config-list"></div>
      <div style="display:flex;gap:8px;margin-top:10px;">
        <input type="number" id="default-stack" placeholder="全員のスタック (BB数)" style="flex:1;padding:6px 8px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:.8rem;">
        <button onclick="applyDefaultStack()" style="padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:.8rem;cursor:pointer">全員に適用</button>
      </div>
    </div>

    <button id="btn-new-hand">▶ New Hand 開始</button>

    <div class="card" id="action-panel-pc">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3 style="margin-bottom:0">アクション入力</h3>
        <button onclick="undoAction()" style="background:var(--surface);border:1px solid var(--border);color:var(--text-sub);border-radius:5px;padding:3px 8px;font-size:.72rem;cursor:pointer;">↩ Undo (1手戻る)</button>
      </div>
      <div id="error-msg" class="hidden"></div>
      <div class="action-grid">
        <button id="btn-fold"  class="btn-fold">FOLD</button>
        <button id="btn-call"  class="btn-call">CHECK / CALL</button>
        <button id="btn-raise" class="btn-raise" onclick="toggleRaisePanel()">RAISE ▾</button>
        <button id="btn-allin" class="btn-allin">ALL IN</button>
      </div>
      <div id="raise-panel" class="hidden" style="margin-top:10px">
        <div class="raise-presets">
          <button class="raise-mult" data-mult="2.5">2.5x</button>
          <button class="raise-mult" data-mult="3">3x</button>
          <button class="raise-mult" data-mult="3.5">3.5x</button>
          <button class="raise-mult" data-mult="4">4x</button>
          <button class="raise-mult" onclick="setPotRaise()">POT</button>
        </div>
        <div class="raise-custom">
          <input type="number" id="raise-input" placeholder="カスタム額" min="0" step="0.5">
          <button id="btn-raise-confirm">確定</button>
        </div>
        <div class="min-raise-label" id="min-raise-label">Min Raise: --</div>
      </div>
    </div>
  </aside>

  <!-- 中央パネル -->
  <main class="center-panel">
    <div id="table-svg-wrap">
      <svg id="table-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="felt" cx="200" cy="200" rx="180" ry="140"/>
        <ellipse class="felt-inner" cx="200" cy="200" rx="165" ry="125"/>
      </svg>
      <div id="seats-container" style="position:absolute;inset:0;"></div>
    </div>

    <div class="board-area">
      <div class="card-slot" id="board-flop1" onclick="promptCard('flop1')">?</div>
      <div class="card-slot" id="board-flop2" onclick="promptCard('flop2')">?</div>
      <div class="card-slot" id="board-flop3" onclick="promptCard('flop3')">?</div>
      <div style="width:4px;"></div>
      <div class="card-slot" id="board-turn"  onclick="promptCard('turn')">?</div>
      <div style="width:4px;"></div>
      <div class="card-slot" id="board-river" onclick="promptCard('river')">?</div>
    </div>
  </main>

  <!-- 右パネル -->
  <aside class="right-panel">
    <div class="card pot-info">
      <h3>ポット</h3>
      <div class="pot-main" id="pot-main">Main Pot: --</div>
      <div class="pot-sides" id="pot-sides"></div>
    </div>

    <div class="card" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
      <h3>アクション履歴</h3>
      <div class="timeline" id="action-timeline"></div>
    </div>

    <div class="card replay-ctrl">
      <h3>リプレイ再生</h3>
      <input type="range" id="replay-bar" min="0" value="0" step="1">
      <div class="replay-btns">
        <button id="btn-replay-prev">⏮</button>
        <button id="btn-replay-play">▶</button>
        <button id="btn-replay-pause">⏸</button>
        <button id="btn-replay-next">⏭</button>
        <button class="speed-btn" data-speed="0.5">0.5x</button>
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="4">4x</button>
      </div>
    </div>
  </aside>
</div>

<!-- スマホ ボトムシート -->
<div class="bottom-sheet">
  <div class="sheet-tabs">
    <button class="sheet-tab active" onclick="switchTab('input')">入力</button>
    <button class="sheet-tab" onclick="switchTab('settings')">ブラインド/スタック</button>
    <button class="sheet-tab" onclick="switchTab('history')">履歴/共有</button>
  </div>

  <div class="sheet-content active" id="tab-input">
    <div id="error-msg-mobile" class="hidden" style="background:var(--red);color:#fff;border-radius:6px;padding:6px 12px;font-size:.82rem;font-weight:600;margin-bottom:8px;"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
      <span style="font-size:.78rem;color:var(--text-sub)">アクション</span>
      <button onclick="undoAction()" style="background:var(--surface2);border:1px solid var(--border);color:var(--text-sub);border-radius:5px;padding:3px 10px;font-size:.75rem;cursor:pointer;">↩ Undo</button>
    </div>
    <div class="action-grid">
      <button id="btn-fold-m"  class="btn-fold"  onclick="actionFold()">FOLD</button>
      <button id="btn-call-m"  class="btn-call">CHECK / CALL</button>
      <button id="btn-raise-m" class="btn-raise" onclick="toggleRaisePanelMobile()">RAISE ▾</button>
      <button id="btn-allin-m" class="btn-allin" onclick="actionAllIn()">ALL IN</button>
    </div>
    <div id="raise-panel-mobile" class="hidden" style="margin-top:10px">
      <div class="raise-presets">
        <button class="raise-mult-m" data-mult="2.5">2.5x</button>
        <button class="raise-mult-m" data-mult="3">3x</button>
        <button class="raise-mult-m" data-mult="3.5">3.5x</button>
        <button class="raise-mult-m" data-mult="4">4x</button>
        <button class="raise-mult-m" onclick="setPotRaise()">POT</button>
      </div>
      <div class="raise-custom">
        <input type="number" id="raise-input-m" placeholder="カスタム額" min="0" step="0.5">
        <button onclick="actionRaise(parseFloat(document.getElementById('raise-input-m').value))">確定</button>
      </div>
      <div class="min-raise-label" id="min-raise-label-m">Min Raise: --</div>
    </div>
    <button onclick="startNewHand()" style="width:100%;margin-top:10px;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">▶ New Hand</button>
  </div>

  <div class="sheet-content" id="tab-settings">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px;">
      <label style="font-size:.78rem;color:var(--text-sub)">SB
        <input type="number" id="input-sb-m" value="1" min="0.01" step="0.5" style="width:100%;margin-top:3px">
      </label>
      <label style="font-size:.78rem;color:var(--text-sub)">BB
        <input type="number" id="input-bb-m" value="2" min="0.01" step="0.5" style="width:100%;margin-top:3px">
      </label>
    </div>
    <div class="rate-presets" style="margin-bottom:10px;">
      <button class="rate-preset" data-sb="0.5" data-bb="1">0.5/1</button>
      <button class="rate-preset" data-sb="1"   data-bb="2">1/2</button>
      <button class="rate-preset" data-sb="2"   data-bb="5">2/5</button>
      <button class="rate-preset" data-sb="5"   data-bb="10">5/10</button>
    </div>
    <div class="seat-config-list" id="seat-config-list-m"></div>
  </div>

  <!-- 履歴・共有タブ (スマホ) -->
  <div class="sheet-content" id="tab-history">
    <div style="display:flex;gap:6px;margin-bottom:10px;">
      <button onclick="copyHandText()" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.78rem;color:var(--text);cursor:pointer;">📋 ハンドコピー</button>
      <button onclick="renderSavedHandsModal()" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.78rem;color:var(--text);cursor:pointer;">💾 保存履歴</button>
    </div>
    <div class="timeline" id="action-timeline-m"></div>
    <input type="range" id="replay-bar-m" min="0" value="0" step="1" style="width:100%;margin-top:8px;accent-color:var(--accent);">
    <div style="display:flex;gap:6px;margin-top:8px;justify-content:center;">
      <button onclick="Replay.stepTo(--Replay.index)">⏮</button>
      <button onclick="Replay.play()">▶</button>
      <button onclick="Replay.pause()">⏸</button>
      <button onclick="Replay.stepTo(++Replay.index)">⏭</button>
    </div>
  </div>
</div>

<!-- Winner 選択モーダル -->
<div class="modal-overlay hidden" id="winner-modal">
  <div class="modal-box">
    <h2>🏆 Winner を選択</h2>
    <p style="font-size:.8rem;color:var(--text-sub)">複数選択するとスプリットポット（チョップ）になります</p>
    <div id="winner-list"></div>
    <button id="btn-confirm-winner">確定して配当</button>
    <button onclick="document.getElementById('winner-modal').classList.add('hidden')"
      style="padding:8px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-sub);cursor:pointer;font-size:.8rem;">キャンセル</button>
  </div>
</div>

<!-- 保存済みハンド一覧 モーダル -->
<div class="modal-overlay hidden" id="saved-hands-modal">
  <div class="modal-box" style="max-width:440px;">
    <h2>💾 保存済みハンド履歴</h2>
    <div id="saved-hands-list" style="max-height:300px;overflow-y:auto;"></div>
    <div style="display:flex;gap:8px;margin-top:10px;">
      <button onclick="exportHandsJSON()" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.8rem;color:var(--text);cursor:pointer;">📥 バックアップ保存(JSON)</button>
      <button onclick="document.getElementById('file-import-input').click()" style="flex:1;padding:8px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.8rem;color:var(--text);cursor:pointer;">📤 復元(JSON選択)</button>
      <input type="file" id="file-import-input" class="hidden" accept=".json" onchange="importHandsJSON(this.files[0])">
    </div>
    <button onclick="document.getElementById('saved-hands-modal').classList.add('hidden')"
      style="padding:8px;background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-sub);cursor:pointer;font-size:.8rem;margin-top:6px;">
      閉じる
    </button>
  </div>
</div>

<script src="project/poker-memo/app.js"></script>
<script>
function switchTab(tab) {
  document.querySelectorAll('.sheet-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.sheet-tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  const tabs = ['input','settings','history'];
  document.querySelectorAll('.sheet-tab').forEach((el, i) => {
    if (tabs[i] === tab) el.classList.add('active');
  });
}

function toggleRaisePanel() {
  document.getElementById('raise-panel').classList.toggle('hidden');
}
function toggleRaisePanelMobile() {
  document.getElementById('raise-panel-mobile').classList.toggle('hidden');
}

function setPotRaise() {
  const potSize = AppState.pot.main;
  const currentCall = getCallAmount(AppState.currentSeatIndex);
  const potRaise = potSize + currentCall * 2;
  ['raise-input','raise-input-m'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = potRaise.toFixed(1);
  });
}

function applyDefaultStack() {
  const bbVal = AppState.blind.bb;
  const input = document.getElementById('default-stack');
  const bbCount = parseFloat(input ? input.value : 100) || 100;
  AppState.seats.forEach(s => { s.stack = bbCount * bbVal; });
  renderAll();
}

function promptCard(slotId) {
  const val = prompt('カードを入力 (例: As, Kh, Td, 2c)');
  if (!val) return;
  const map = { flop1:0, flop2:1, flop3:2, turn:3, river:4 };
  AppState.board[map[slotId]] = val.trim();
  renderBoard();
}

function renderSeatConfigUI() {
  const isBBUnit = AppState.blind.displayUnit === 'bb';
  const bbVal = AppState.blind.bb || 1;

  ['seat-config-list', 'seat-config-list-m'].forEach(listId => {
    const list = document.getElementById(listId);
    if (!list) return;
    list.innerHTML = '';
    AppState.seats.forEach((seat, i) => {
      const displayStackVal = isBBUnit ? (seat.stack / bbVal).toFixed(1) : seat.stack;
      const row = document.createElement('div');
      row.className = 'seat-config-row';
      row.innerHTML =
        '<span style="font-size:.72rem;color:var(--text-sub);min-width:32px">' + getPositionName(i) + '</span>' +
        '<input type="text" value="' + seat.name + '" data-seat="' + i + '" class="player-name-input" placeholder="プレイヤー名">' +
        '<input type="number" value="' + displayStackVal + '" data-seat="' + i + '" class="stack-input" min="0" step="1" style="width:70px" title="' + (isBBUnit ? 'スタック(BB数)' : 'スタック(金額)') + '">' +
        '<button class="away-toggle ' + (seat.isAway ? 'away-on' : '') + '" data-seat="' + i + '">' + (seat.isAway ? '離席中' : '在席') + '</button>';
      list.appendChild(row);
    });
    list.querySelectorAll('.player-name-input').forEach(function(input) {
      input.addEventListener('change', function(e) {
        AppState.seats[parseInt(input.dataset.seat)].name = e.target.value;
        renderSeats();
      });
    });
    list.querySelectorAll('.stack-input').forEach(function(input) {
      input.addEventListener('change', function(e) {
        const idx = parseInt(input.dataset.seat);
        const val = parseFloat(e.target.value) || 0;
        AppState.seats[idx].stack = isBBUnit ? val * bbVal : val;
        renderSeats();
      });
    });
    list.querySelectorAll('.away-toggle').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(btn.dataset.seat);
        AppState.seats[idx].isAway = !AppState.seats[idx].isAway;
        btn.textContent = AppState.seats[idx].isAway ? '離席中' : '在席';
        btn.classList.toggle('away-on', AppState.seats[idx].isAway);
        renderSeats();
      });
    });
  });
}

function renderSeatsDOM() {
  var container = document.getElementById('seats-container');
  if (!container) return;
  var n = AppState.seatCount;
  var cx = 50, cy = 50, rx = 40, ry = 30;
  AppState.seats.forEach(function(seat, i) {
    var node = document.getElementById('seat-' + i);
    if (!node) {
      node = document.createElement('div');
      node.className = 'seat-node';
      node.id = 'seat-' + i;
      node.innerHTML =
        '<div class="seat-avatar"><span class="seat-action"></span></div>' +
        '<div class="seat-pos"></div>' +
        '<div class="seat-name"></div>' +
        '<div class="seat-stack"></div>' +
        '<div class="seat-bet"></div>';
      container.appendChild(node);
    }
    var angle = (2 * Math.PI * i / n) - Math.PI / 2;
    var x = cx + rx * Math.cos(angle);
    var y = cy + ry * Math.sin(angle);
    node.style.left = x + '%';
    node.style.top  = y + '%';
  });
  document.querySelectorAll('.seat-node').forEach(function(node) {
    var idx = parseInt(node.id.replace('seat-',''));
    if (idx >= n) node.remove();
  });
}

function updateTimeline() {
  ['action-timeline','action-timeline-m'].forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = '';
    var lastStreet = '';
    AppState.history.forEach(function(step) {
      if (step.street !== lastStreet) {
        var label = document.createElement('div');
        label.className = 'street-label';
        label.textContent = step.street.toUpperCase();
        el.appendChild(label);
        lastStreet = step.street;
      }
      var item = document.createElement('div');
      item.className = 'timeline-item';
      var seatName = AppState.seats[step.seatIndex] ? AppState.seats[step.seatIndex].name : ('Seat ' + (step.seatIndex + 1));
      item.innerHTML =
        '<span>' + seatName + '</span>' +
        '<span class="action">' + step.action.toUpperCase() + ' ' + (step.amount > 0 ? formatAmount(step.amount) : '') + '</span>';
      el.appendChild(item);
    });
    el.scrollTop = el.scrollHeight;
  });
  ['replay-bar','replay-bar-m'].forEach(function(id) {
    var bar = document.getElementById(id);
    if (bar) bar.max = Math.max(0, AppState.history.length - 1);
  });
}

var _origRenderAll = renderAll;
window.renderAll = function() {
  renderSeatsDOM();
  renderSeatConfigUI();
  _origRenderAll();
  updateTimeline();
};

document.querySelectorAll('.speed-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.speed-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
  });
});

document.getElementById('btn-call-m') && document.getElementById('btn-call-m').addEventListener('click', actionCall);
document.getElementById('btn-fold-m') && document.getElementById('btn-fold-m').addEventListener('click', actionFold);
document.getElementById('btn-allin-m') && document.getElementById('btn-allin-m').addEventListener('click', actionAllIn);

document.querySelectorAll('.raise-mult-m').forEach(function(btn) {
  btn.addEventListener('click', function() {
    if (btn.dataset.mult) {
      var mult = parseFloat(btn.dataset.mult);
      var maxBet = Math.max.apply(null, AppState.seats.map(function(s) { return s.betAmount; }));
      var raiseAmount = maxBet + Math.max(AppState.lastRaiseDelta, AppState.blind.bb) * mult;
      var input = document.getElementById('raise-input-m');
      if (input) input.value = raiseAmount.toFixed(1);
    }
  });
});

document.getElementById('input-sb-m') && document.getElementById('input-sb-m').addEventListener('input', function(e) {
  AppState.blind.sb = parseFloat(e.target.value) || 1;
  var pc = document.getElementById('input-sb');
  if (pc) pc.value = e.target.value;
});
document.getElementById('input-bb-m') && document.getElementById('input-bb-m').addEventListener('input', function(e) {
  AppState.blind.bb = parseFloat(e.target.value) || 2;
  var pc = document.getElementById('input-bb');
  if (pc) pc.value = e.target.value;
});
</script>
</body>
</html>
