<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎴 Poker Memo Web</title>
  <meta name="description" content="ライブポーカー ハンド入力・アクションテーブル・ハンドリプレイ Webツール">
  <meta name="theme-color" content="#0d1117">
  <link rel="stylesheet" href="project/poker-memo/style.css">
</head>
<body>

<div class="app-container">

  <!-- ===== ヘッダー ＆ メインナビゲーション ===== -->
  <header class="header">
    <div class="header-brand">
      <h1>🎴 Poker Memo</h1>
      <span id="street-badge" class="badge" style="background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-size:.75rem;font-weight:700;">PREFLOP</span>
    </div>

    <!-- 画面切替 メニューナビゲーション -->
    <nav class="main-nav">
      <button class="nav-item active" onclick="switchView('live')" id="nav-live">🎮 ライブ卓</button>
      <button class="nav-item" onclick="switchView('settings')" id="nav-settings">⚙️ 卓・スタック設定</button>
      <button class="nav-item" onclick="switchView('history')" id="nav-history">🎬 履歴 ＆ リプレイ</button>
    </nav>
  </header>

  <!-- ===== メインコンテンツ (3パネル切替) ===== -->
  <main class="app-content">

    <!-- エラー・通知バナー -->
    <div id="error-msg" class="hidden" style="background:var(--red);color:#fff;border-radius:8px;padding:8px 14px;font-size:.85rem;font-weight:600;margin-bottom:12px;"></div>

    <!-- VIEW 1: 🎮 ライブ卓 (Live Table) -->
    <section class="view-panel active" id="view-live">
      <div class="live-table-layout">

        <div class="table-center-card">
          <div id="table-svg-wrap">
            <svg id="table-svg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
              <ellipse class="felt" cx="200" cy="200" rx="180" ry="140"/>
              <ellipse class="felt-inner" cx="200" cy="200" rx="165" ry="125"/>
            </svg>
            <div id="seats-container" style="position:absolute;inset:0;"></div>
          </div>

          <div class="board-area">
            <div class="card-slot" id="board-flop1" onclick="openCardPicker('flop1')">?</div>
            <div class="card-slot" id="board-flop2" onclick="openCardPicker('flop2')">?</div>
            <div class="card-slot" id="board-flop3" onclick="openCardPicker('flop3')">?</div>
            <div style="width:4px;"></div>
            <div class="card-slot" id="board-turn"  onclick="openCardPicker('turn')">?</div>
            <div style="width:4px;"></div>
            <div class="card-slot" id="board-river" onclick="openCardPicker('river')">?</div>
          </div>
        </div>

        <div class="live-controls-panel">
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <h3 style="margin-bottom:0">ポット</h3>
              <button id="unit-toggle" style="background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:3px 10px;font-size:.78rem;cursor:pointer;">表示: BB</button>
            </div>
            <div class="pot-main" id="pot-main" style="font-size:1.1rem;font-weight:700;color:var(--yellow);margin-top:6px;">Main Pot: --</div>
            <div class="pot-sides" id="pot-sides" style="font-size:.78rem;color:var(--text-sub);margin-top:4px;"></div>
          </div>

          <div class="card">
            <h3>アクション入力</h3>
            <button class="btn-undo" onclick="actionUndo()">↩ Undo (1手戻る)</button>

            <div class="action-grid">
              <button class="action-btn btn-fold"  onclick="actionFold()">FOLD</button>
              <button class="action-btn btn-call"  id="btn-call" onclick="actionCall()">CHECK / CALL</button>
              <button class="action-btn btn-raise" onclick="toggleRaisePanel()">RAISE ▾</button>
              <button class="action-btn btn-allin" onclick="actionAllIn()">ALL IN</button>
            </div>

            <div id="raise-panel" class="hidden" style="margin-top:10px">
              <div class="raise-presets">
                <button class="raise-mult" data-mult="2.5" onclick="setRaiseMult(2.5)">2.5x</button>
                <button class="raise-mult" data-mult="3"   onclick="setRaiseMult(3)">3x</button>
                <button class="raise-mult" data-mult="3.5" onclick="setRaiseMult(3.5)">3.5x</button>
                <button class="raise-mult" data-mult="4"   onclick="setRaiseMult(4)">4x</button>
                <button class="raise-mult" onclick="setPotRaise()">POT</button>
              </div>
              <div class="raise-custom">
                <input type="number" id="raise-input" placeholder="カスタム額" min="0" step="0.5">
                <button onclick="confirmRaise()">確定</button>
              </div>
              <div class="min-raise-label" id="min-raise-label" style="font-size:.75rem;color:var(--text-sub);margin-top:6px;">Min Raise: --</div>
            </div>
          </div>

          <button id="btn-new-hand" onclick="startNewHand()" style="padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;">▶ New Hand 開始</button>
        </div>

      </div>
    </section>

    <!-- VIEW 2: ⚙️ 卓・ブラインド設定 -->
    <section class="view-panel" id="view-settings">
      <div class="settings-grid">
        <div class="card">
          <h3>テーブル人数 ＆ ブラインド設定</h3>
          <div style="margin-bottom:12px;">
            <label style="font-size:.8rem;color:var(--text-sub);display:block;margin-bottom:4px">卓人数</label>
            <select id="seat-count" style="width:100%;padding:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:.85rem;">
              <option value="2">2名 (HU)</option>
              <option value="3">3名</option>
              <option value="4">4名</option>
              <option value="5">5名</option>
              <option value="6" selected>6名 (6-Max)</option>
              <option value="7">7名</option>
              <option value="8">8名</option>
              <option value="9">9名 (Full Ring)</option>
            </select>
          </div>

          <label style="font-size:.8rem;color:var(--text-sub);display:block;margin-bottom:6px">レートプリセット</label>
          <div class="rate-presets" style="margin-bottom:12px;">
            <button class="rate-preset" onclick="setRatePreset(0.5, 1)">0.5/1</button>
            <button class="rate-preset" onclick="setRatePreset(1, 2)">1/2</button>
            <button class="rate-preset" onclick="setRatePreset(2, 5)">2/5</button>
            <button class="rate-preset" onclick="setRatePreset(5, 10)">5/10</button>
            <button class="rate-preset" onclick="setRatePreset(10, 20)">10/20</button>
            <button class="rate-preset" onclick="setRatePreset(25, 50)">25/50</button>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
            <label style="font-size:.78rem;color:var(--text-sub)">SB
              <input type="number" id="input-sb" value="1" min="0.01" step="0.5" style="width:100%;padding:6px;margin-top:3px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            </label>
            <label style="font-size:.78rem;color:var(--text-sub)">BB
              <input type="number" id="input-bb" value="2" min="0.01" step="0.5" style="width:100%;padding:6px;margin-top:3px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            </label>
          </div>

          <label style="font-size:.8rem;color:var(--text-sub);display:block;margin-bottom:4px">アンティ種別</label>
          <select id="ante-type" style="width:100%;padding:8px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:.85rem;">
            <option value="none">なし</option>
            <option value="regular">通常 Ante（全員）</option>
            <option value="bb" selected>BB Ante（BBが全員分）</option>
          </select>
        </div>

        <div class="card">
          <h3>プレイヤー名 ＆ スタック設定</h3>
          <div style="display:flex;gap:8px;margin-bottom:14px;">
            <input type="number" id="default-stack" placeholder="全員のスタック (BB数)" style="flex:1;padding:8px 10px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-size:.85rem;">
            <button onclick="applyDefaultStack()" style="padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:.85rem;font-weight:700;cursor:pointer;">全員に一括適用</button>
          </div>
          <div class="seat-config-list" id="seat-config-list"></div>
        </div>
      </div>
    </section>

    <!-- VIEW 3: 🎬 履歴 ＆ リプレイ -->
    <section class="view-panel" id="view-history">
      <div class="history-layout">
        <div class="card" style="display:flex;flex-direction:column;gap:12px;">
          <h3>アクション履歴 ＆ リプレイ再生</h3>
          <div class="timeline" id="action-timeline"></div>

          <div style="margin-top:auto;padding-top:10px;border-top:1px solid var(--border)">
            <input type="range" id="replay-bar" min="0" value="0" step="1" style="width:100%;accent-color:var(--accent);cursor:pointer;">
            <div style="display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap;">
              <button onclick="Replay.stepTo(--Replay.index)" style="padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;">⏮ 前の手</button>
              <button onclick="Replay.play()" style="padding:6px 12px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;">▶ 再生</button>
              <button onclick="Replay.pause()" style="padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;">⏸ 一時停止</button>
              <button onclick="Replay.stepTo(++Replay.index)" style="padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);cursor:pointer;">⏭ 次の手</button>
            </div>
          </div>
        </div>

        <div class="card" style="display:flex;flex-direction:column;gap:12px;">
          <h3>ハンド共有 ＆ 保存履歴管理</h3>
          <div style="display:flex;gap:8px;">
            <button onclick="copyHandText()" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-weight:600;color:var(--text);cursor:pointer;">📋 ハンドテキストをコピー</button>
            <button onclick="exportHandsJSON()" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;font-size:.85rem;font-weight:600;color:var(--text);cursor:pointer;">📥 JSONバックアップ保存</button>
          </div>
          <div style="margin-top:10px;">
            <h4 style="font-size:.8rem;color:var(--text-sub);margin-bottom:8px;">💾 IndexedDB 保存済みハンド履歴</h4>
            <div id="saved-hands-list" style="max-height:240px;overflow-y:auto;"></div>
          </div>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- Winner 選択モーダル -->
<div class="modal-overlay hidden" id="winner-modal">
  <div class="modal-box">
    <h2>🏆 Winner を選択</h2>
    <p style="font-size:.8rem;color:var(--text-sub)">複数選択するとスプリットポット（チョップ）になります</p>
    <div id="winner-list"></div>
    <button id="btn-confirm-winner" style="padding:12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;">確定して配当</button>
  </div>
</div>

<!-- 4x13 カードピッカー モーダル -->
<div class="modal-overlay hidden" id="card-picker-modal">
  <div class="modal-box card-picker-box">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h2>🎴 カードを選択 (<span id="picker-target-label">--</span>)</h2>
      <button onclick="closeCardPicker()" style="background:transparent;border:none;color:var(--text-sub);font-size:1.2rem;cursor:pointer;">✕</button>
    </div>
    <div class="card-picker-matrix" id="card-picker-matrix"></div>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px;">
      <input type="text" id="card-manual-input" placeholder="手入力 (例: As, Kh, Td, 2c)" style="flex:1;padding:8px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:.85rem;">
      <button onclick="applyManualCardInput()" style="padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:.85rem;font-weight:700;cursor:pointer;">決定</button>
      <button onclick="clearCurrentCardSlot()" style="padding:8px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:.85rem;color:var(--red);cursor:pointer;">クリア</button>
    </div>
  </div>
</div>

<script src="project/poker-memo/app.js"></script>
<script>
function switchView(viewName) {
  document.querySelectorAll('.view-panel').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

  document.getElementById(`view-${viewName}`).classList.add('active');
  document.getElementById(`nav-${viewName}`).classList.add('active');

  if (viewName === 'history') {
    renderSavedHandsListUI();
  }
}

function toggleRaisePanel() {
  document.getElementById('raise-panel').classList.toggle('hidden');
}

function setRaiseMult(mult) {
  const maxBet = Math.max(...AppState.seats.map(s => s.betAmount));
  const raiseAmount = maxBet + Math.max(AppState.lastRaiseDelta, AppState.blind.bb) * mult;
  const input = document.getElementById('raise-input');
  if (input) input.value = raiseAmount.toFixed(1);
}

function setPotRaise() {
  const potSize = AppState.pot.main;
  const currentCall = getCallAmount(AppState.currentSeatIndex);
  const potRaise = (potSize + currentCall) + currentCall;
  const input = document.getElementById('raise-input');
  if (input) input.value = potRaise.toFixed(1);
}

function confirmRaise() {
  const val = parseFloat(document.getElementById('raise-input').value);
  if (val) actionRaise(val);
}

function setRatePreset(sb, bb) {
  AppState.blind.sb = sb;
  AppState.blind.bb = bb;
  AppState.blind.anteAmount = bb;
  document.getElementById('input-sb').value = sb;
  document.getElementById('input-bb').value = bb;
  updateMinRaise(bb, bb);
  renderAll();
}

function applyDefaultStack() {
  const bbVal = AppState.blind.bb;
  const input = document.getElementById('default-stack');
  const bbCount = parseFloat(input?.value) || 100;
  AppState.seats.forEach(s => { s.stack = bbCount * bbVal; });
  renderAll();
}

function renderSeatConfigUI() {
  const isBBUnit = AppState.blind.displayUnit === 'bb';
  const bbVal = AppState.blind.bb || 1;
  const list = document.getElementById('seat-config-list');
  if (!list) return;
  list.innerHTML = '';

  AppState.seats.forEach((seat, i) => {
    const displayStackVal = isBBUnit ? (seat.stack / bbVal).toFixed(1) : seat.stack;
    const row = document.createElement('div');
    row.className = 'seat-config-row';
    row.innerHTML = `
      <span style="font-size:.75rem;color:var(--text-sub);min-width:36px">${getPositionName(i)}</span>
      <input type="text" value="${seat.name}" data-seat="${i}" class="player-name-input" placeholder="プレイヤー名">
      <input type="number" value="${displayStackVal}" data-seat="${i}" class="stack-input" min="0" step="1" style="width:75px">
      <button class="away-toggle ${seat.isAway ? 'away-on' : ''}" data-seat="${i}">
        ${seat.isAway ? '離席中' : '在席'}
      </button>`;
    list.appendChild(row);
  });

  list.querySelectorAll('.player-name-input').forEach(input => {
    input.addEventListener('change', e => {
      AppState.seats[parseInt(input.dataset.seat)].name = e.target.value;
      renderSeats();
    });
  });
  list.querySelectorAll('.stack-input').forEach(input => {
    input.addEventListener('change', e => {
      const idx = parseInt(input.dataset.seat);
      const val = parseFloat(e.target.value) || 0;
      AppState.seats[idx].stack = isBBUnit ? val * bbVal : val;
      renderSeats();
    });
  });
  list.querySelectorAll('.away-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.seat);
      AppState.seats[idx].isAway = !AppState.seats[idx].isAway;
      btn.textContent = AppState.seats[idx].isAway ? '離席中' : '在席';
      btn.classList.toggle('away-on', AppState.seats[idx].isAway);
      renderSeats();
    });
  });
}

function renderSeatsDOM() {
  const container = document.getElementById('seats-container');
  if (!container) return;
  const n = AppState.seatCount;
  const cx = 50, cy = 50;
  const rx = 40, ry = 30;

  AppState.seats.forEach((seat, i) => {
    let node = document.getElementById(`seat-${i}`);
    if (!node) {
      node = document.createElement('div');
      node.className = 'seat-node';
      node.id = `seat-${i}`;
      node.innerHTML = `
        <div class="seat-avatar">
          <span class="seat-action"></span>
        </div>
        <div class="seat-pos"></div>
        <div class="seat-name"></div>
        <div class="seat-stack"></div>
        <div class="seat-bet"></div>`;
      container.appendChild(node);
    }
    const angle = (2 * Math.PI * i / n) - Math.PI / 2;
    const x = cx + rx * Math.cos(angle);
    const y = cy + ry * Math.sin(angle);
    node.style.left = `${x}%`;
    node.style.top  = `${y}%`;
  });

  document.querySelectorAll('.seat-node').forEach(node => {
    const idx = parseInt(node.id.replace('seat-',''));
    if (idx >= n) node.remove();
  });
}

function updateTimeline() {
  const el = document.getElementById('action-timeline');
  if (!el) return;
  el.innerHTML = '';
  let lastStreet = '';

  AppState.history.forEach(step => {
    if (step.street !== lastStreet) {
      const label = document.createElement('div');
      label.className = 'street-label';
      label.textContent = step.street.toUpperCase();
      el.appendChild(label);
      lastStreet = step.street;
    }
    const item = document.createElement('div');
    item.className = 'timeline-item';
    const name = AppState.seats[step.seatIndex]?.name ?? `Seat ${step.seatIndex + 1}`;
    item.innerHTML = `
      <span>${name}</span>
      <span class="action">${step.action.toUpperCase()} ${step.amount > 0 ? formatAmount(step.amount) : ''}</span>`;
    el.appendChild(item);
  });
  el.scrollTop = el.scrollHeight;

  const bar = document.getElementById('replay-bar');
  if (bar) bar.max = Math.max(0, AppState.history.length - 1);
}

async function renderSavedHandsListUI() {
  const list = document.getElementById('saved-hands-list');
  if (!list) return;
  list.innerHTML = '';
  const hands = await fetchAllHandsFromDB();

  if (hands.length === 0) {
    list.innerHTML = '<div style="font-size:.82rem;color:var(--text-sub);padding:10px;text-align:center">保存されたハンド履歴はありません</div>';
  } else {
    hands.reverse().forEach(h => {
      const item = document.createElement('div');
      item.style.cssText = 'background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;';
      const dateStr = new Date(h.savedAt).toLocaleString();
      const boardStr = h.board ? h.board.filter(c => c !== '').join(' ') : '';
      item.innerHTML = `
        <div>
          <div style="font-weight:700;font-size:.82rem">Hand #${h.id} (${h.seatCount || 6}-Max)</div>
          <div style="font-size:.72rem;color:var(--text-sub)">${dateStr} | Board: [${boardStr || 'N/A'}]</div>
        </div>
        <div style="display:flex;gap:4px">
          <button onclick="loadHandFromData(${h.id})" style="padding:4px 8px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-size:.75rem;cursor:pointer">復元</button>
          <button onclick="deleteSavedHand(${h.id})" style="padding:4px 6px;background:var(--red);color:#fff;border:none;border-radius:4px;font-size:.75rem;cursor:pointer">削除</button>
        </div>`;
      list.appendChild(item);
    });
  }
}

const _origRenderAll = renderAll;
window.renderAll = function() {
  renderSeatsDOM();
  renderSeatConfigUI();
  _origRenderAll();
  updateTimeline();
};
</script>
</body>
</html>
