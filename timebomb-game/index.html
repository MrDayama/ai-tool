<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>タイムボム (Timebomb) - Prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:    #07090f;
            --panel: rgba(14,17,30,0.82);
            --border: rgba(255,255,255,0.06);
            --red:   #ff3838;
            --green: #05c46b;
            --cyan:  #00d2d3;
            --gold:  #ffd32a;
            --muted: #6c7a8d;
            --light: #e8eaf0;
            --font:  'Outfit', sans-serif;
            --mono:  'Share Tech Mono', monospace;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--light);
            min-height: 100vh;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow-x: hidden;
            background-image:
                radial-gradient(ellipse at 0% 0%,   rgba(255,56,56,.12) 0, transparent 55%),
                radial-gradient(ellipse at 100% 100%,rgba(0,210,211,.12) 0, transparent 55%);
        }

        /* ── flash / shake ── */
        .shake { animation: shakeFx .65s cubic-bezier(.36,.07,.19,.97) both; }
        .flash-r { animation: flashR .45s ease-out; }
        .flash-g { animation: flashG .45s ease-out; }

        /* ── layout ── */
        .container { width: 100%; max-width: 1020px; padding: 20px; }
        .glass {
            background: var(--panel);
            backdrop-filter: blur(22px);
            border: 1px solid var(--border);
            border-radius: 26px;
            padding: 36px 40px;
            box-shadow: 0 28px 56px rgba(0,0,0,.55);
        }

        /* ── title ── */
        h1 {
            font-size: 2.8rem; font-weight: 900;
            text-align: center; margin-bottom: 30px;
            background: linear-gradient(120deg, #ff3838 0%, #ff7070 28%, #00d2d3 65%, #54a0ff 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
        }

        /* ── setup ── */
        .setup-screen { display: flex; flex-direction: column; gap: 24px; }
        .form-group   { display: flex; flex-direction: column; gap: 8px; }
        .form-group label {
            font-size: .82rem; color: var(--muted);
            text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700;
        }
        select, input[type="text"] {
            background: rgba(255,255,255,.03);
            border: 1px solid rgba(255,255,255,.09);
            color: var(--light); padding: 15px 20px;
            border-radius: 13px; font-size: 1rem; font-family: var(--font);
            transition: .3s; width: 100%;
        }
        select:focus, input[type="text"]:focus {
            outline: none; border-color: var(--red);
            box-shadow: 0 0 14px rgba(255,56,56,.22);
        }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        @media(max-width:560px){ .input-grid{ grid-template-columns: 1fr; } }

        .btn {
            background: linear-gradient(135deg, var(--red), #ff6060);
            color: #fff; border: none; padding: 17px 32px;
            border-radius: 15px; font-size: 1.05rem; font-weight: 800;
            cursor: pointer; width: 100%; text-align: center;
            transition: .3s cubic-bezier(.175,.885,.32,1.275);
            box-shadow: 0 10px 24px rgba(255,56,56,.28);
        }
        .btn:hover  { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(255,56,56,.42); }
        .btn:active { transform: translateY(1px); }

        /* ── game screen ── */
        .game-screen { display: none; }

        /* ════════════════════════════════
           ★ WIRE TRACKER（残りカット）
           ════════════════════════════════ */
        .tracker-section {
            margin-bottom: 22px;
        }
        .tracker-label {
            font-size: .72rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px;
        }
        .wire-track {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .wire-slot {
            position: relative; width: 70px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px;
            background: rgba(255,255,255,.03);
            border: 1.5px solid rgba(255,255,255,.1);
            transition: all .4s ease;
            overflow: hidden;
        }
        /* ワイヤーライン（横線） */
        .wire-slot::before {
            content: '';
            position: absolute;
            left: 8px; right: 8px; top: 50%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgba(0,210,211,.5) 30%, rgba(0,210,211,.9) 50%, rgba(0,210,211,.5) 70%, transparent);
            border-radius: 2px;
            transform: translateY(-50%);
            transition: all .4s ease;
        }
        .wire-slot::after {
            content: attr(data-num);
            font-family: var(--mono);
            font-size: .68rem;
            color: rgba(255,255,255,.3);
            position: absolute;
            bottom: 3px; right: 5px;
        }
        /* ニッパーアイコン（カット前） */
        .wire-slot .nipper {
            position: relative; z-index: 2;
            font-size: 1.3rem;
            filter: grayscale(.4) opacity(.6);
            transition: all .4s ease;
        }
        /* カット済み状態 */
        .wire-slot.cut {
            background: rgba(255,56,56,.08);
            border-color: rgba(255,56,56,.3);
        }
        .wire-slot.cut::before {
            background: linear-gradient(90deg, transparent, rgba(255,56,56,.4) 30%, rgba(255,56,56,.7) 50%, rgba(255,56,56,.4) 70%, transparent);
            clip-path: polygon(0 45%, 46% 45%, 52% 0%, 54% 0%, 48% 48%, 100% 48%, 100% 52%, 52% 52%, 54% 100%, 52% 100%, 48% 55%, 0 55%);
        }
        .wire-slot.cut .nipper {
            filter: none;
            transform: rotate(-20deg) scale(1.1);
            opacity: 1;
        }
        /* 現在の手番（次にカットする人） */
        .wire-slot.active {
            background: rgba(0,210,211,.1);
            border-color: rgba(0,210,211,.5);
            box-shadow: 0 0 14px rgba(0,210,211,.2);
            animation: wirePulse 1.6s ease-in-out infinite;
        }
        .wire-slot.active::before {
            background: linear-gradient(90deg, transparent, rgba(0,210,211,.7) 30%, #00d2d3 50%, rgba(0,210,211,.7) 70%, transparent);
            animation: wireGlow 1.6s ease-in-out infinite;
        }
        .wire-slot.active .nipper { filter: none; opacity: 1; }

        /* ════════════════════════════════
           ★ DEFUSE TRACKER（解除チップ）
           ════════════════════════════════ */
        .defuse-track {
            display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
        }
        .defuse-chip {
            width: 52px; height: 52px; border-radius: 50%;
            border: 2.5px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.02);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            transition: all .5s cubic-bezier(.175,.885,.32,1.275);
            position: relative; overflow: hidden;
        }
        .defuse-chip::before {
            content: '';
            position: absolute; inset: 0; border-radius: 50%;
            background: radial-gradient(circle, rgba(5,196,107,.0) 50%, transparent 100%);
            transition: all .5s ease;
        }
        /* 解除済み */
        .defuse-chip.found {
            border-color: var(--green);
            background: rgba(5,196,107,.15);
            box-shadow: 0 0 18px rgba(5,196,107,.5), inset 0 0 10px rgba(5,196,107,.1);
            animation: defusePop .5s cubic-bezier(.175,.885,.32,1.275);
        }
        .defuse-chip.found::before {
            background: radial-gradient(circle, rgba(5,196,107,.25) 40%, transparent 100%);
        }
        /* 爆弾（ゲーム終了後表示） */
        .defuse-chip.boom-chip {
            border-color: var(--red);
            background: rgba(255,56,56,.15);
            box-shadow: 0 0 18px rgba(255,56,56,.5);
        }

        /* ════════════════════════════════
           ラウンドアナウンス
           ════════════════════════════════ */
        #round-announce {
            display: none; text-align: center; font-size: 1.5rem; font-weight: 900;
            padding: 18px 24px; margin-bottom: 20px;
            background: linear-gradient(135deg, rgba(0,210,211,.12), rgba(255,56,56,.05));
            border: 1px solid rgba(0,210,211,.25); border-radius: 16px;
            animation: fadeSlide .5s ease;
        }

        /* 手番アナウンス */
        .turn-box {
            background: linear-gradient(135deg, rgba(0,210,211,.1), rgba(255,56,56,.03));
            border: 1px dashed rgba(0,210,211,.3);
            border-radius: 16px; padding: 16px 24px;
            text-align: center; margin-bottom: 26px;
        }
        .cutter-name { font-size: 1.55rem; font-weight: 900; color: var(--cyan); text-shadow: 0 0 12px rgba(0,210,211,.35); }
        .turn-hint   { font-size: .88rem; color: var(--muted); margin-top: 4px; }

        /* ── Player rows ── */
        .players-board { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .player-row {
            background: rgba(255,255,255,.01);
            border: 1px solid rgba(255,255,255,.04);
            border-radius: 20px; padding: 20px 24px;
            display: flex; align-items: center;
            justify-content: space-between; gap: 16px;
            transition: .3s ease;
        }
        .player-row.is-cutter {
            border-color: rgba(0,210,211,.28);
            box-shadow: 0 0 18px rgba(0,210,211,.07);
            background: rgba(0,210,211,.012);
        }
        .player-info { min-width: 170px; display: flex; flex-direction: column; gap: 8px; }
        .player-name-el { font-size: 1.2rem; font-weight: 800; }
        .peek-btn {
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.08);
            color: var(--muted); font-size: .78rem; padding: 7px 12px;
            border-radius: 9px; cursor: pointer; user-select: none;
            text-align: center; font-weight: 600; transition: .2s;
        }

        /* ── 3D Cards ── */
        .player-cards { display: flex; gap: 12px; flex-grow: 1; justify-content: flex-end; flex-wrap: wrap; }
        .card-container { width: 72px; height: 112px; perspective: 600px; cursor: pointer; }
        .card-inner {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d;
            transition: transform .55s cubic-bezier(.4,0,.2,1);
        }
        .card-container.flipped .card-inner { transform: rotateY(180deg); }
        .card-front, .card-back {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 6px 14px rgba(0,0,0,.45);
        }
        .card-back {
            background: linear-gradient(145deg, #111728, #07090f);
            border: 2px solid rgba(255,255,255,.08); overflow: hidden;
        }
        .card-back::before {
            content: ''; position: absolute; width: 78%; height: 78%;
            border: 1px solid rgba(255,56,56,.14); border-radius: 7px;
        }
        .card-back::after { content: '💣'; font-size: 1.75rem; opacity: .2; transition: .3s; }
        .card-container:hover:not(.flipped) .card-back { border-color: rgba(255,56,56,.38); }
        .card-container:hover:not(.flipped) .card-back::after { opacity: .6; transform: scale(1.1); }
        .card-front { transform: rotateY(180deg); }
        .card-front.safe  { background: radial-gradient(circle,#3d4357,#1c2030); border: 2px solid rgba(255,255,255,.1); }
        .card-front.safe::after  { content: '💤'; font-size: 2rem; }
        .card-front.scute { background: radial-gradient(circle,#05c46b,#037d43); border: 2px solid var(--green); box-shadow: 0 0 20px rgba(5,196,107,.45); }
        .card-front.scute::after { content: '⚡'; font-size: 2.4rem; text-shadow: 0 0 10px rgba(255,255,255,.7); animation: pulse 1.5s infinite; }
        .card-front.boom  { background: radial-gradient(circle,#ff3838,#9e0e0e); border: 2px solid var(--red); box-shadow: 0 0 30px rgba(255,56,56,.85); }
        .card-front.boom::after  { content: '💥'; font-size: 2.8rem; animation: shakeBomb .3s infinite; }

        /* ── particles ── */
        .fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 999; }
        .particle  { position: absolute; border-radius: 50%; pointer-events: none; animation: flyOut 1.2s cubic-bezier(.1,.8,.3,1) forwards; }

        /* ── modal ── */
        .modal {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.92); backdrop-filter: blur(14px);
            align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content { max-width: 500px; width: 90%; text-align: center; }
        .modal-title { font-size: 2.3rem; font-weight: 900; margin-bottom: 16px; }
        .modal-body  { font-size: 1.08rem; margin-bottom: 28px; color: var(--muted); line-height: 1.65; }
        .role-badge  { display: inline-block; padding: 5px 13px; border-radius: 8px; font-weight: 800; margin: 5px; }
        .role-badge.police { background: var(--cyan); color: #000; }
        .role-badge.bomber { background: var(--red);  color: #fff; }

        /* ── keyframes ── */
        @keyframes pulse      { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
        @keyframes shakeBomb  { 0%,100%{transform:translate(1px,1px)} 50%{transform:translate(-1px,-1px) rotate(-2deg)} }
        @keyframes shakeFx    { 10%,90%{transform:translate3d(-4px,0,0)} 20%,80%{transform:translate3d(6px,0,0)} 30%,50%,70%{transform:translate3d(-9px,0,0)} 40%,60%{transform:translate3d(9px,0,0)} }
        @keyframes flashR     { 0%{background-color:rgba(255,56,56,.5)} 100%{background-color:transparent} }
        @keyframes flashG     { 0%{background-color:rgba(5,196,107,.4)} 100%{background-color:transparent} }
        @keyframes flyOut     { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0} }
        @keyframes wireGlow   { 0%,100%{opacity:.6} 50%{opacity:1} }
        @keyframes wirePulse  { 0%,100%{box-shadow:0 0 10px rgba(0,210,211,.15)} 50%{box-shadow:0 0 20px rgba(0,210,211,.4)} }
        @keyframes defusePop  { 0%{transform:scale(.7);opacity:0} 60%{transform:scale(1.15)} 100%{transform:scale(1);opacity:1} }
        @keyframes fadeSlide  { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
<div id="fx-layer" class="fx-layer"></div>

<div class="container">
<h1>TIME BOMB</h1>

<!-- ── Setup ── -->
<div id="setup-screen" class="glass setup-screen">
    <h2 style="font-size:1.6rem;border-left:5px solid var(--red);padding-left:14px;margin-bottom:0">ゲーム設定</h2>
    <div class="form-group">
        <label for="pcnt">プレイヤー人数</label>
        <select id="pcnt">
            <option value="3">3人</option>
            <option value="4" selected>4人</option>
            <option value="5">5人</option>
            <option value="6">6人</option>
            <option value="7">7人</option>
            <option value="8">8人</option>
        </select>
    </div>
    <div class="form-group">
        <label>プレイヤー名</label>
        <div id="name-grid" class="input-grid"></div>
    </div>
    <button id="start-btn" class="btn">ゲームスタート ✂️</button>
</div>

<!-- ── Game ── -->
<div id="game-screen" class="glass game-screen">

    <!-- ★ ワイヤーカットトラッカー -->
    <div class="tracker-section">
        <div class="tracker-label">✂️ このラウンドの残りカット</div>
        <div id="wire-track" class="wire-track"></div>
    </div>

    <!-- ★ 解除チップトラッカー -->
    <div class="tracker-section">
        <div class="tracker-label">⚡ 解除コード進捗</div>
        <div id="defuse-track" class="defuse-track"></div>
    </div>

    <!-- ラウンドアナウンス -->
    <div id="round-announce"></div>

    <!-- 手番 -->
    <div class="turn-box">
        <div class="cutter-name" id="cutter-disp">—</div>
        <div class="turn-hint">の手番 ─ 自分以外のプレイヤーのカードを1枚選んでください</div>
    </div>

    <!-- ボード -->
    <div id="board" class="players-board"></div>
</div>
</div>

<!-- ── Modal ── -->
<div id="modal" class="modal">
<div class="glass modal-content">
    <div id="modal-title" class="modal-title"></div>
    <div id="modal-body"  class="modal-body"></div>
    <button id="modal-close" class="btn">もう一度遊ぶ</button>
</div>
</div>

<script>
/* =========================================================
   タイムボム ゲームエンジン（スタンドアロン版）

   ラウンドルール：
     各ラウンド N 回（N = プレイヤー人数）カットしたら終了。
     残ったカードを回収・シャッフルして再配布。
     R1:各5枚  R2:各4枚  R3:各3枚  R4:各2枚
   ========================================================= */

const CFG = {
    3:{police:2,bomber:1,scutes:3, safe:11},
    4:{police:3,bomber:1,scutes:4, safe:15},
    5:{police:3,bomber:2,scutes:5, safe:19},
    6:{police:4,bomber:2,scutes:6, safe:23},
    7:{police:5,bomber:2,scutes:7, safe:27},
    8:{police:5,bomber:3,scutes:8, safe:31},
};
const PER_ROUND = {1:5, 2:4, 3:3, 4:2};

let G = {};

const $ = id => document.getElementById(id);
const fxLayer   = $('fx-layer');
const setupScr  = $('setup-screen');
const gameScr   = $('game-screen');
const nameGrid  = $('name-grid');
const pcntSel   = $('pcnt');
const startBtn  = $('start-btn');
const wireTrack = $('wire-track');
const defTrack  = $('defuse-track');
const roundAnn  = $('round-announce');
const cutDisp   = $('cutter-disp');
const boardEl   = $('board');
const modal     = $('modal');
const modalTit  = $('modal-title');
const modalBod  = $('modal-body');

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a; }

// ── name inputs ──
function buildNames(){
    const n = +pcntSel.value;
    nameGrid.innerHTML='';
    for(let i=1;i<=n;i++){
        const d=document.createElement('div');
        d.className='form-group';
        d.innerHTML=`<label>プレイヤー ${i}</label><input type="text" id="pn${i}" value="プレイヤー ${i}">`;
        nameGrid.appendChild(d);
    }
}
pcntSel.addEventListener('change', buildNames);
buildNames();

startBtn.addEventListener('click',()=>{
    const n=+pcntSel.value;
    const names=Array.from({length:n},(_,i)=>$(`pn${i+1}`).value||`プレイヤー ${i+1}`);
    initGame(n,names);
    setupScr.style.display='none';
    gameScr.style.display='block';
    roundAnn.style.display='none';
});

// ── init ──
function initGame(n,names){
    const cfg=CFG[n];
    const roles=[...Array(cfg.police).fill('POLICE'),...Array(cfg.bomber).fill('BOMBER')];
    shuffle(roles);

    let uid=1;
    const pool=[];
    for(let i=0;i<cfg.scutes;i++) pool.push({id:uid++,type:'scute',rev:false});
    pool.push({id:uid++,type:'boom',rev:false});
    for(let i=0;i<cfg.safe;i++)   pool.push({id:uid++,type:'safe', rev:false});

    G={
        n, pool,
        players: names.map((name,i)=>({name,role:roles[i],cards:[]})),
        scutesGoal: cfg.scutes,
        scutesFound: 0,
        bombFound: false,
        round: 1,
        roundCuts: 0,          // このラウンドでのカット枚数
        cutterIdx: Math.floor(Math.random()*n),
        // 各スロットに「誰がカットしたか」を記録（tracker用）
        roundSlots: [],        // length=n, 各要素 null or {playerName,type}
        isAnim: false,
    };
    dealCards();
    render();
}

// ── deal ──
function dealCards(){
    G.players.forEach(p=>p.cards=[]);
    const unrev=G.pool.filter(c=>!c.rev);
    shuffle(unrev);
    const per=PER_ROUND[G.round];
    G.players.forEach((p,i)=>{
        p.cards=unrev.slice(i*per,(i+1)*per);
        shuffle(p.cards);
    });
    G.roundCuts=0;
    G.roundSlots=Array(G.n).fill(null); // スロットリセット
}

// ── render ──
function render(){
    renderWireTracker();
    renderDefuseTracker();
    cutDisp.textContent = G.players[G.cutterIdx].name;

    boardEl.innerHTML='';
    G.players.forEach((player,pIdx)=>{
        const isCutter=(pIdx===G.cutterIdx);
        const row=document.createElement('div');
        row.className=`player-row${isCutter?' is-cutter':''}`;

        // 情報
        const info=document.createElement('div');
        info.className='player-info';
        const nm=document.createElement('span');
        nm.className='player-name-el';
        nm.textContent=player.name;
        info.appendChild(nm);

        const peek=document.createElement('div');
        peek.className='peek-btn';
        peek.textContent='正体・手札を確認';
        const showP=()=>{
            const s=player.cards.filter(c=>c.type==='scute').length;
            const b=player.cards.filter(c=>c.type==='boom').length;
            const e=player.cards.filter(c=>c.type==='safe').length;
            peek.textContent=`${player.role==='POLICE'?'👮 時空警察':'💣 ボマー団'}  解除:${s} 爆弾:${b} ハズレ:${e}`;
            peek.style.background=player.role==='POLICE'?'var(--cyan)':'var(--red)';
            peek.style.color=player.role==='POLICE'?'#000':'#fff';
        };
        const hideP=()=>{
            peek.textContent='正体・手札を確認';
            peek.style.background='rgba(255,255,255,.04)';
            peek.style.color='var(--muted)';
        };
        ['mousedown','touchstart'].forEach(e=>peek.addEventListener(e,showP));
        ['mouseup','mouseleave','touchend'].forEach(e=>peek.addEventListener(e,hideP));
        info.appendChild(peek);
        row.appendChild(info);

        // カード
        const cardsDiv=document.createElement('div');
        cardsDiv.className='player-cards';
        player.cards.forEach((card,cIdx)=>{
            const cont=document.createElement('div');
            const inn =document.createElement('div');
            const bk  =document.createElement('div');
            const fr  =document.createElement('div');
            cont.className='card-container';
            inn.className ='card-inner';
            bk.className  ='card-back';
            fr.className  =`card-front ${card.type}`;
            inn.appendChild(bk); inn.appendChild(fr);
            cont.appendChild(inn);
            if(card.rev){ cont.classList.add('flipped'); }
            else {
                cont.addEventListener('click',()=>{
                    if(G.isAnim) return;
                    if(pIdx===G.cutterIdx){ alert('自分のカードはカットできません！'); return; }
                    cutCard(cont,pIdx,cIdx);
                });
            }
            cardsDiv.appendChild(cont);
        });
        row.appendChild(cardsDiv);
        boardEl.appendChild(row);
    });
}

// ── Wire Tracker（残りカット）──
function renderWireTracker(){
    wireTrack.innerHTML='';
    for(let i=0;i<G.n;i++){
        const slot=document.createElement('div');
        slot.className='wire-slot';
        slot.setAttribute('data-num', i+1);

        const nipper=document.createElement('span');
        nipper.className='nipper';

        const slotData = G.roundSlots[i];
        if(slotData !== null){
            // カット済み
            slot.classList.add('cut');
            // カードの種類によってアイコンを変える
            if(slotData.type==='scute')      nipper.textContent='⚡';
            else if(slotData.type==='boom')  nipper.textContent='💥';
            else                             nipper.textContent='✂️';
        } else if(i === G.roundCuts){
            // 現在アクティブなスロット（次にカットされる）
            slot.classList.add('active');
            nipper.textContent='✂️';
        } else {
            nipper.textContent='✂️';
        }
        slot.appendChild(nipper);
        wireTrack.appendChild(slot);
    }
}

// ── Defuse Tracker（解除チップ）──
function renderDefuseTracker(){
    defTrack.innerHTML='';
    for(let i=0;i<G.scutesGoal;i++){
        const chip=document.createElement('div');
        chip.className='defuse-chip';
        if(i<G.scutesFound){
            chip.classList.add('found');
            chip.textContent='⚡';
        } else {
            chip.textContent='○';
            chip.style.color='rgba(255,255,255,.12)';
            chip.style.fontSize='.9rem';
        }
        defTrack.appendChild(chip);
    }
    // 爆弾枠も1つ追加（常にグレー、BOOMが出たら赤くなる）
    const boomChip=document.createElement('div');
    boomChip.className='defuse-chip';
    boomChip.style.marginLeft='8px';
    boomChip.style.border='2.5px dashed rgba(255,56,56,.3)';
    boomChip.textContent='💣';
    boomChip.style.opacity=G.bombFound?'1':'0.3';
    if(G.bombFound) boomChip.classList.add('boom-chip');
    defTrack.appendChild(boomChip);
}

// ── Cut card ──
function cutCard(cont,pIdx,cIdx){
    G.isAnim=true;
    cont.classList.add('flipped');

    setTimeout(()=>{
        const card=G.players[pIdx].cards[cIdx];
        const rect=cont.getBoundingClientRect();
        const cx=rect.left+rect.width/2;
        const cy=rect.top+rect.height/2;

        card.rev=true;

        // ラウンドスロットに記録
        G.roundSlots[G.roundCuts]={playerName:G.players[pIdx].name, type:card.type};
        G.roundCuts++;

        if(card.type==='scute'){ G.scutesFound++; spark(cx,cy,'green'); }
        else if(card.type==='boom'){ G.bombFound=true; spark(cx,cy,'boom'); }

        // カットされたプレイヤーが次の手番
        G.cutterIdx=pIdx;
        G.isAnim=false;

        render();
        checkStatus();
    }, 550);
}

// ── Status ──
function checkStatus(){
    if(G.scutesFound===G.scutesGoal){
        setTimeout(()=>showModal('👮 時空警察の勝利！','すべての解除コードがカットされ、爆弾の安全な解除に成功しました！'),400);
        return;
    }
    if(G.bombFound){
        setTimeout(()=>showModal('💥 ボマー団の勝利！','BOOM カードがカットされてしまいました！大爆発が起きました！'),1000);
        return;
    }
    if(G.roundCuts===G.n){
        if(G.round===4){
            setTimeout(()=>showModal('💥 ボマー団の勝利！','全4ラウンドが終了しましたが解除コードを揃えられませんでした。爆弾が爆発しました（時間切れ）。'),400);
        } else {
            G.round++;
            dealCards();
            showRoundAnnounce(G.round,()=>render());
        }
    }
}

// ── Round Announce ──
function showRoundAnnounce(round,cb){
    roundAnn.style.display='block';
    roundAnn.innerHTML=`
        🔄 ラウンド ${round} 開始！<br>
        <span style="font-size:.95rem;font-weight:400;color:var(--muted)">
            カードを回収・シャッフルして再配布しました。各自 <strong>${PER_ROUND[round]} 枚</strong> を確認してください。
        </span>`;
    setTimeout(()=>{ roundAnn.style.display='none'; cb(); }, 2600);
}

// ── Particle FX ──
function spark(x,y,mode){
    if(mode==='boom'){
        document.body.classList.remove('shake','flash-r');
        void document.body.offsetWidth;
        document.body.classList.add('shake','flash-r');
        setTimeout(()=>document.body.classList.remove('shake','flash-r'),900);
    } else {
        document.body.classList.remove('flash-g');
        void document.body.offsetWidth;
        document.body.classList.add('flash-g');
        setTimeout(()=>document.body.classList.remove('flash-g'),600);
    }
    const cnt=mode==='boom'?110:45;
    const cols=mode==='boom'
        ?['#ffa502','#ff4757','#ff6b81','#ffdd59','#ff3838']
        :['#05c46b','#0be881','#00d2d3','#81ecec','#fff'];
    for(let i=0;i<cnt;i++){
        const p=document.createElement('div');
        p.className='particle';
        const sz=Math.random()*(mode==='boom'?16:8)+(mode==='boom'?8:4);
        p.style.cssText=`width:${sz}px;height:${sz}px;left:${x}px;top:${y}px;`;
        const ang=mode==='boom'?Math.random()*Math.PI*2:(i/cnt)*Math.PI*2+Math.random()*.3;
        const dist=Math.random()*(mode==='boom'?480:140)+(mode==='boom'?100:50);
        p.style.setProperty('--tx',`${Math.cos(ang)*dist}px`);
        p.style.setProperty('--ty',`${Math.sin(ang)*dist}px`);
        const c=cols[Math.floor(Math.random()*cols.length)];
        p.style.background=`radial-gradient(circle,#fff 0%,${c} 65%,transparent 100%)`;
        p.style.boxShadow=`0 0 ${mode==='boom'?12:8}px ${c}88`;
        fxLayer.appendChild(p);
        setTimeout(()=>p.remove(),1200);
    }
}

// ── Modal ──
function showModal(title,msg){
    modalTit.textContent=title;
    let html=`${msg}<div style="text-align:left;background:rgba(0,0,0,.3);padding:16px;border-radius:12px;margin-top:16px;">
        <strong>【全員の陣営公開】</strong><br>`;
    G.players.forEach(p=>{
        html+=`${p.name}: <span class="role-badge ${p.role==='POLICE'?'police':'bomber'}">${p.role==='POLICE'?'👮 時空警察':'💣 ボマー団'}</span><br>`;
    });
    html+='</div>';
    modalBod.innerHTML=html;
    modal.style.display='flex';
}
$('modal-close').addEventListener('click',()=>{
    modal.style.display='none';
    gameScr.style.display='none';
    setupScr.style.display='flex';
});
</script>
